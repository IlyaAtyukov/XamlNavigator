name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: echo "PACKAGE_VERSION=$('${{ github.ref_name }}'.Substring(1))" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          $extra = @(); if ($env:PACKAGE_VERSION) { $extra += "-p:Version=$env:PACKAGE_VERSION" }
          dotnet build XamlNavigator.sln -c Release @extra

      - name: Test
        run: dotnet test XamlNavigator.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Pack
        shell: pwsh
        run: |
          $extra = @(); if ($env:PACKAGE_VERSION) { $extra += "-p:Version=$env:PACKAGE_VERSION" }
          dotnet pack XamlNavigator.sln -c Release --no-build -o artifacts @extra

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
